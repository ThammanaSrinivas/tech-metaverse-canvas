<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000f1a"/>
      <stop offset="50%" style="stop-color:#001020"/>
      <stop offset="100%" style="stop-color:#001a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="50%" style="stop-color:#bf00ff"/>
      <stop offset="100%" style="stop-color:#ff0080"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00f5ff"/>
      <stop offset="50%" style="stop-color:#bf00ff"/>
      <stop offset="80%" style="stop-color:#ff0080"/>
      <stop offset="100%" style="stop-color:#ff0080;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00f5ff" stroke-width="0.3" opacity="0.12"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Semi-transparent geometric shapes for depth -->
  <rect x="900" y="80" width="220" height="220" rx="20" fill="#00f5ff" opacity="0.03" transform="rotate(15 1010 190)"/>
  <rect x="850" y="350" width="180" height="180" rx="16" fill="#bf00ff" opacity="0.04" transform="rotate(-10 940 440)"/>
  <circle cx="150" cy="520" r="100" fill="#ff0080" opacity="0.03"/>

  <!-- Scattered particle dots -->
  <circle cx="180" cy="80" r="2" fill="#00f5ff" opacity="0.5"/>
  <circle cx="350" cy="45" r="1.5" fill="#bf00ff" opacity="0.4"/>
  <circle cx="520" cy="90" r="1" fill="#ff0080" opacity="0.6"/>
  <circle cx="700" cy="60" r="2.5" fill="#00f5ff" opacity="0.3"/>
  <circle cx="900" cy="40" r="1.5" fill="#bf00ff" opacity="0.5"/>
  <circle cx="1050" cy="100" r="2" fill="#00f5ff" opacity="0.4"/>
  <circle cx="1100" cy="250" r="1" fill="#ff0080" opacity="0.5"/>
  <circle cx="1050" cy="400" r="1.5" fill="#00f5ff" opacity="0.35"/>
  <circle cx="950" cy="520" r="2" fill="#bf00ff" opacity="0.4"/>
  <circle cx="750" cy="570" r="1" fill="#00f5ff" opacity="0.5"/>
  <circle cx="500" cy="550" r="2" fill="#ff0080" opacity="0.3"/>
  <circle cx="300" cy="580" r="1.5" fill="#bf00ff" opacity="0.45"/>
  <circle cx="100" cy="300" r="1" fill="#00f5ff" opacity="0.4"/>
  <circle cx="60" cy="150" r="1.5" fill="#ff0080" opacity="0.35"/>
  <circle cx="1150" cy="500" r="2" fill="#00f5ff" opacity="0.3"/>
  <circle cx="800" cy="150" r="1" fill="#bf00ff" opacity="0.5"/>
  <circle cx="450" cy="500" r="1.5" fill="#00f5ff" opacity="0.4"/>
  <circle cx="650" cy="480" r="2" fill="#ff0080" opacity="0.35"/>

  <!-- Wide accent line with glow -->
  <rect x="80" y="200" width="300" height="4" rx="2" fill="url(#accent)" filter="url(#softGlow)"/>

  <!-- Code brackets -->
  <g transform="translate(80, 400) scale(2.5)" opacity="0.25">
    <path d="M8 10 L4 16 L8 22" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 10 L28 16 L24 22" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="14" y="14" width="4" height="4" fill="url(#accent)" rx="1"/>
  </g>

  <!-- Name with glow -->
  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#f0f0f0" letter-spacing="-1" filter="url(#glow)">Srinivas Thammana</text>

  <!-- Title -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="300" fill="#00f5ff" letter-spacing="2">DIGITAL ARCHITECT</text>

  <!-- Subtitle -->
  <text x="80" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8899aa">Full-Stack Developer · System Design · 3D Web Experiences</text>

  <!-- Tech stack -->
  <text x="80" y="545" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="16" fill="#5a7a8a" letter-spacing="3">React | TypeScript | Three.js | Node.js</text>

  <!-- Site URL -->
  <text x="80" y="580" font-family="ui-monospace, 'Cascadia Code', monospace" font-size="14" fill="#3a5a6a" letter-spacing="1">srinivas-t.web.app</text>

  <!-- Bottom accent dots -->
  <circle cx="1040" cy="560" r="5" fill="#00f5ff" opacity="0.6"/>
  <circle cx="1065" cy="560" r="5" fill="#bf00ff" opacity="0.6"/>
  <circle cx="1090" cy="560" r="5" fill="#ff0080" opacity="0.6"/>
  <circle cx="1115" cy="560" r="4" fill="#00f5ff" opacity="0.3"/>
</svg>
